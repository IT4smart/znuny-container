<VirtualHost *:8080>
    ServerName znuny-container
    DocumentRoot /opt/znuny/var/httpd/htdocs

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:8443>
    ServerName znuny-container
    DocumentRoot /opt/znuny/var/httpd/htdocs

    SSLEngine on
    SSLCertificateFile /etc/ssl/znuny/znuny.crt
    SSLCertificateKeyFile /etc/ssl/znuny/znuny.key

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
</IfModule>
