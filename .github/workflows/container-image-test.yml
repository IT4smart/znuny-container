name: Container image runtime test

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-compose.yml
      - files/**
  push:
    branches:
      - main

jobs:
  test-container:
    name: Build and smoke test container image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Ensure Docker Compose is available
        run: docker compose version

      - name: Start services with docker-compose
        run: |
          mkdir -p ./znuny_backups
          chmod 777 ./znuny_backups
          docker compose down --remove-orphans || true
          docker compose up --build -d

      - name: Wait for Znuny web interface
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /tmp/znuny-response.html -w '%{http_code}' http://127.0.0.1/znuny/index.pl || true)
            if [ "$status" = "200" ] && grep -qE 'Znuny|znuny' /tmp/znuny-response.html; then
              echo "Znuny web interface is reachable"
              exit 0
            fi
            echo "Waiting for Znuny web interface... status=$status ($i/30)"
            sleep 10
          done
          echo "Last response body:"
          cat /tmp/znuny-response.html
          exit 1

      - name: Test backup is correctly running
        run: |
          # Verify backup script exists and is executable
          docker compose exec -T znuny test -x /znuny_backup.sh && echo "Backup script is executable"

          # Trigger a manual backup
          echo "Triggering backup..."
          docker compose exec -T znuny /znuny_backup.sh
          
          # Verify backup file was created
          echo "Verifying backup file was created..."
          if [ -f znuny_backups/otrs-*.tar.gz ]; then
            echo "Backup file found:"
            ls -lh znuny_backups/otrs-*.tar.gz
          else
            echo "ERROR: No backup file found in znuny_backups/"
            exit 1
          fi

      - name: Cleanup services
        if: always()
        run: docker compose down --remove-orphans
