name: Container image build

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - files/**
  push:
    tags:
      - '*'

jobs:
  lint:
    name: Dockerfile lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Dockerfile linter
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  build:
    name: Build container image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set short SHA
        id: short_sha
        run: echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/it4smart/${{ github.event.repository.name }}:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.short_sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source="https://github.com/IT4smart/znuny-container"
